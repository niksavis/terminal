# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: quality-gates-macos

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Python dependencies
        run: uv sync --locked
      - name: Run the test suite
        run: uv run python .scripts/git-hooks/pre-push.py
