# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: e2e-install

"on":
  push:
    tags:
      - "v*"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to install. Empty means the commit of this run.
        required: false
        default: ""
      agents:
        description: Value for --agents, for example all or claude,codex.
        required: false
        default: all

permissions:
  contents: read

concurrency:
  group: e2e-install-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: false

env:
  TERMINAL_SETUP_REF: ${{ inputs.ref || github.sha }}
  AGENTS: ${{ inputs.agents || 'all' }}
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install as a consumer
        shell: bash
        run: sh ./install.sh --unattended --agents "${AGENTS}" --herdr --report

  linux-container:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        image:
          - ubuntu:24.04
          - debian:12
    container: ${{ matrix.image }}
    steps:
      - name: Install the documented prerequisites
        shell: sh
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl git wget ca-certificates sudo
      - uses: actions/checkout@v4
      - name: Install as a consumer
        shell: bash
        run: |
          set -o pipefail
          sh ./install.sh --unattended --agents "${AGENTS}" 2>&1 | tee "${RUNNER_TEMP}/first.log"
          grep -q "Setup complete." "${RUNNER_TEMP}/first.log"
      - name: Check the version lines
        shell: bash
        run: |
          export PATH="${HOME}/.local/bin:${PATH}"
          for tool in uv python3 node claude copilot codex; do
            command -v "${tool}" >/dev/null || { echo "${tool} is missing from PATH"; exit 1; }
            printf '%s: %s\n' "${tool}" "$("${tool}" --version 2>&1 | head -n 1)"
          done
          python3 --version | grep -Eq '^Python 3\.14\.' || { echo "python3 is not 3.14"; exit 1; }
          node --version | grep -Eq '^v26\.' || { echo "node is not v26"; exit 1; }
      - name: Run setup again and expect present tools
        shell: bash
        run: |
          set -o pipefail
          sh ./install.sh --unattended --agents "${AGENTS}" 2>&1 | tee "${RUNNER_TEMP}/second.log"
          log="${RUNNER_TEMP}/second.log"
          grep -q "Setup complete." "${log}"
          grep -Eq "Python 3\.14\.[0-9]+ is present" "${log}" || { echo "Python was not reported as present"; exit 1; }
          grep -Eq "Node\.js v26\.[0-9.]+ is up to date" "${log}" || { echo "Node.js was not reported as up to date"; exit 1; }
          if grep -Eq ": install (uv|Node\.js|Python 3\.14)$" "${log}"; then echo "The second run installed uv, Node.js or Python again"; exit 1; fi

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install the documented prerequisites
        shell: bash
        run: command -v wget >/dev/null || brew install wget
      - name: Install as a consumer
        shell: bash
        run: sh ./install.sh --unattended --agents "${AGENTS}" --herdr --report

  windows-wsl:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: git curl wget
      - name: Install ripgrep with winget, to test the replace option
        id: winget
        continue-on-error: true
        shell: powershell
        run: winget install --id BurntSushi.ripgrep.MSVC --exact --scope user --silent --disable-interactivity --accept-source-agreements --accept-package-agreements
      - name: Install as a consumer
        shell: powershell
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User')
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 --unattended --agents $env:AGENTS --herdr --winget-versions replace --report
      - name: Check that the setup copy replaced the winget ripgrep
        if: steps.winget.outcome == 'success'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $tools = Join-Path $env:LOCALAPPDATA 'Programs\terminal-tools\bin'
          if (-not (Test-Path (Join-Path $tools 'rg.exe'))) { throw "rg.exe is missing in $tools" }
          $left = winget list --id BurntSushi.ripgrep.MSVC --exact --disable-interactivity --accept-source-agreements | Out-String
          if ($left -match 'BurntSushi.ripgrep.MSVC') { throw 'winget still lists ripgrep' }
          Write-Output "rg.exe is in $tools and winget no longer lists ripgrep."
          $global:LASTEXITCODE = 0

  windows-without-wsl:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install as a consumer and expect the WSL refusal
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $log = Join-Path $env:RUNNER_TEMP 'install.log'
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 --unattended *>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          $output = Get-Content -Raw $log
          if ($code -eq 0) { throw 'Setup succeeded on Windows without a WSL distro; it must stop at the prerequisite check.' }
          if ($output -notmatch 'Some prerequisites are missing') { throw 'Setup failed, but not at the prerequisite check.' }
          if ($output -match 'Installing tools') { throw 'Setup started to install tools on Windows without a WSL distro.' }
          Write-Output "Setup stopped at the prerequisite check with exit code $code, as documented."
          $global:LASTEXITCODE = 0
