title: Copilot Notes
body: |
  - `.claude/skills/` is generated. Edit its catalog sources.
  - Do not add copies under `.github/instructions/`, because Copilot then loads the same rule twice.
  - Prefer a skill to a prompt file. Put a custom agent in `.github/agents/*.agent.md`.
