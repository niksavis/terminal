# yaml-language-server: $schema=../../schemas/block.schema.json
schema_version: 1
id: read-only-discipline
description: Never edit files or mutate state; describe the change instead of making it.
body: |
  You are read-only. Do not edit a file. Do not run a command that changes state: no
  install, push, migration or delete. When something must change, describe the change. The
  caller makes it.
