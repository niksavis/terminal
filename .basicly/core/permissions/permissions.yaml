# Baseline agent permissions: an allow list and a deny list, projected per target
# (basicly-u0zg, basicly-zem45s8.1).
#
# `allow` lists narrow `permissions.allow` patterns for Claude Code. Each entry names one
# command family that reads or checks, and no pattern accepts a program named on its
# command line. `basicly verify` runs the checks that `basicly.toml` configures, the same
# class as the `Bash(npm test)` rule that the vendor documents as narrow. The loader
# refuses an allow that auto mode drops, because such a rule grants arbitrary code
# execution: a blanket `Bash`, a wildcard in the program position, an interpreter, a
# package manager, a command wrapper, an `Agent` or a `Monitor` rule. Rule syntax is from
# code.claude.com/docs/en/permissions (read 2026-09-25): a trailing ` *` also matches the
# bare command, and `:*` is an equivalent spelling that this file does not use.
#
# `basicly permissions-build` adds each missing pattern and removes nothing, so a
# repository's own allow, ask and deny rules survive every install. That includes a
# blanket `Bash`, `Edit`, `Write`, `WebSearch` or `WebFetch` allow that the repository
# wrote itself: basicly does not ship them, and it never removes them.
#
# A tool is left out of `allow` when a pattern cannot exclude its dangerous form:
# `rg` (`--pre` and `--hostname-bin` run a command), `fd` (`-x`, `-X`), `find`
# (`-exec`, `-delete`), `bat` (`--pager`), `yq` (`-i` writes in place), and
# `git diff`, `git log`, `git show` (`--output` writes a file). `ls`, `cat`, `head`,
# `grep`, `find` and the read-only forms of git are in Claude Code's built-in read-only
# set, which needs no rule in any mode.
#
# Each deny entry is a semantic guardrail. `claude` lists the native
# `permissions.deny` patterns Claude Code enforces at tool time, projected into
# every consumer's co-owned agent config by `basicly permissions-build`.
# `copilot` (basicly-lqz5) lists native `--deny-tool` specs the copilot runner
# injects at invocation time. A config file does exist — approvals are saved to
# `~/.copilot/permissions-config.json` — but it cannot express a *deny*: GitHub's
# own docs state it supports no deny rules, ask rules, default modes, URL rules,
# tool filtering or repo-local shared policy, and directs you to `--deny-tool` for
# all of them. github/copilot-cli#2398 asks for one and is still open (re-verified
# 2026-08-06). Stated as "cannot express deny" rather than "has no config file"
# deliberately: a reader who finds that file would otherwise read this note as
# stale and drop the injection. Invocation-time injection is also the *stronger*
# form, not merely the available one — a deny takes precedence over an allow even
# under `--allow-all` and even over a matching saved approval, so a stale approval
# on someone's machine cannot override it. Both are authored here once so a consumer inherits
# the guardrail on install instead of only the dogfooding repo having it.
#
# Copilot mapping is best-effort: `--deny-tool='shell(<prefix>)'` matches a
# command by token PREFIX with no infix wildcard (verified against copilot CLI
# v1.0.70), so it cannot express the claude globs faithfully — flag-reordered or
# variant spellings (e.g. `rm -r -f`) slip through, and the `.env` file
# read/edit rules have no path-scoped copilot form, so they carry no `copilot`
# list: `--deny-tool=read` is a real deny name (probed 2026-07-26, see
# runner._DECIDER_DENY_COPILOT) but takes no path argument, so the only copilot
# form of one `.env` rule would deny every read a working agent needs.
# Codex sandbox/approval defaults remain invocation-only too (basicly-t0kt,
# --sandbox/-a), not yet wired.
#
# So this list is a PARTIAL backstop, never the source of a prohibition
# (basicly-tcmy.10). The `require-explicit-confirmation` fragment carries the
# rule; entries here only block what a given target can express. Notably
# `git checkout -- <path>`, `git restore` and `git stash` are equally
# destructive and are not denied on any target — they need confirmation all the
# same. Do not infer permission from the absence of an entry, and do not delete
# a fragment bullet because no rule here mirrors it.
allow:
  - id: file-read-tools
    description: read and search files in the working directory without a prompt
    claude:
      - "Read"
      - "Glob"
      - "Grep"
  - id: git-read
    description: read the repository state with git commands that write no file and run no program
    claude:
      - "Bash(git status *)"
      - "Bash(git rev-parse *)"
      - "Bash(git ls-files *)"
      - "Bash(git worktree list *)"
      - "Bash(git branch)"
      - "Bash(git branch --show-current)"
  - id: basicly-read
    description: read the repository snapshot and the tracker ledger with basicly on the path
    claude:
      - "Bash(basicly status *)"
      - "Bash(basicly tracker show *)"
      - "Bash(basicly tracker list *)"
      - "Bash(basicly tracker ready *)"
      - "Bash(basicly tracker stats *)"
  - id: basicly-check
    description: run the basicly drift checks and the configured verify checks, without a fix or a recorded gate
    claude:
      - "Bash(basicly check)"
      - "Bash(basicly skills-check *)"
      - "Bash(basicly styles-check *)"
      - "Bash(basicly agents-check)"
      - "Bash(basicly hooks-check)"
      - "Bash(basicly permissions-check)"
      - "Bash(basicly catalog lint)"
      - "Bash(basicly verify)"
      - "Bash(basicly verify --mode fast)"
      - "Bash(basicly verify --mode full)"
      - "Bash(basicly verify --mode staged)"
deny:
  - id: destructive-rm
    description: block recursive force-remove of files
    claude:
      - "Bash(rm -rf*)"
      - "Bash(rm -fr*)"
      - "Bash(rm -r -f*)"
      - "Bash(rm -f -r*)"
    copilot:
      - "shell(rm -rf)"
      - "shell(rm -fr)"
  - id: force-push
    description: block force / lease-force pushes that rewrite remote history
    claude:
      - "Bash(git push --force*)"
      - "Bash(git push --force-with-lease*)"
      - "Bash(git push -f*)"
      - "Bash(git push*--force*)"
    copilot:
      - "shell(git push --force)"
      - "shell(git push --force-with-lease)"
      - "shell(git push -f)"
  - id: bypass-gates
    description: block skipping the commit/push gates (no-verify / no-gpg-sign)
    claude:
      - "Bash(git push*--no-verify*)"
      - "Bash(git push*--no-gpg-sign*)"
      - "Bash(git commit*--no-verify*)"
      - "Bash(git commit*--no-gpg-sign*)"
    copilot:
      - "shell(git commit --no-verify)"
      - "shell(git commit --no-gpg-sign)"
      - "shell(git push --no-verify)"
      - "shell(git push --no-gpg-sign)"
  - id: destructive-git
    description: block hard reset, force clean, and history rewrites
    claude:
      - "Bash(git reset --hard*)"
      - "Bash(git clean*-f*)"
      - "Bash(git filter-branch*)"
      - "Bash(git filter-repo*)"
    copilot:
      - "shell(git reset --hard)"
      - "shell(git clean -f)"
      - "shell(git filter-branch)"
      - "shell(git filter-repo)"
  - id: env-read
    description: block reading dotenv secret files
    claude:
      - "Read(.env)"
      - "Read(.env.*)"
      - "Read(**/.env)"
      - "Read(**/.env.*)"
      - "Read(**/.env.local)"
  - id: env-edit
    description: block mutating dotenv secret files via any file-writing tool
    claude:
      # `Edit(path)` file-permission rules cover every Claude Code file-mutation
      # tool (Edit, Write, NotebookEdit), so `.env` cannot be created or
      # overwritten through any write path. Do not add Write(...)/NotebookEdit(...)
      # variants: they are not matched by file permission checks and are rejected
      # with a warning at startup.
      - "Edit(.env)"
      - "Edit(.env.*)"
      - "Edit(**/.env)"
      - "Edit(**/.env.*)"
