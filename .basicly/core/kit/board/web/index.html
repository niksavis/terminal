<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: var(--text-base)/var(--leading-normal) var(--font-sans); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: var(--space-5); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: var(--text-md); margin: 0; }
  header .search-box { flex: 0 1 28rem; min-width: 0; }
  header #new { flex: none; white-space: nowrap; }
  #search { width: 100%; padding: var(--space-2) var(--space-4); border: 1px solid var(--edge); border-radius: var(--radius-3); background: var(--bg); }
  #counts { display: flex; gap: var(--space-5); color: var(--muted); font-size: var(--text-base); margin-left: auto; }
  #counts b { color: var(--text); }
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(22rem, 44%) 1fr; }
  #list-pane { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #detail-pane { min-width: 0; overflow-wrap: anywhere; overflow: auto; padding: var(--space-5) var(--space-6) var(--space-8); }
  .toolbar { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line); }
  .tab, .chip { border: 1px solid var(--line); background: transparent; border-radius: var(--radius-pill); padding: var(--space-0) var(--space-4); cursor: pointer; color: var(--muted); }
  .tab[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--on-accent); }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tab .n { opacity: .75; margin-left: var(--space-1); font-size: var(--text-xs); }
  .grow { flex: 1; }
  select.small { padding: var(--space-0) var(--space-2); border: 1px solid var(--edge); border-radius: var(--radius-2); background: var(--panel); }
  #rows { list-style: none; margin: 0; padding: var(--space-2) var(--space-3); overflow: auto; flex: 1; }
  #rows button { all: unset; display: grid; grid-template-columns: 1.1rem 1fr; gap: var(--space-1) var(--space-3); align-items: baseline; width: 100%; box-sizing: border-box; padding: var(--space-3) var(--space-3); border-radius: var(--radius-3); cursor: pointer; }
  #rows button:hover { background: var(--raise); }
  #rows button:focus-visible { outline: 2px solid var(--accent); }
  #rows button > .st { grid-row: 1; align-self: center; }
  #rows button > .title { grid-column: 2; }
  #rows button > .meta, #rows button > .links-line { grid-column: 1 / -1; }
  #rows button[aria-current="true"] { background: var(--raise); box-shadow: var(--shadow-current); }
  .title { font-weight: var(--weight-medium); }
  .meta { color: var(--muted); font-size: var(--text-sm); display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-1) var(--space-3); }
  .id { font-family: var(--font-mono); font-size: var(--text-sm); color: var(--muted); }
  .pr0 { color: var(--on-accent); background: var(--bad-fill); border-color: var(--bad-fill) !important; } .pr1 { color: var(--warn); }
  .pr2 { color: var(--text); } .pr3, .pr4, .pr- { color: var(--muted); }
  .pill { display: inline-block; font-size: var(--text-xs); font-weight: var(--weight-bold); line-height: var(--leading-normal); padding: 0 var(--space-3); border-radius: var(--radius-pill); border: 1px solid currentColor; }
  .pill[class*="t-"] { color: var(--muted); border-color: var(--line); font-weight: var(--weight-medium); }
  .st { flex: none; width: .8rem; height: .8rem; border-radius: 50%; border: 2px solid var(--muted); box-sizing: border-box; display: inline-block; position: relative; }
  .st-in_progress { border-color: var(--accent); background: linear-gradient(90deg, var(--accent) 50%, transparent 50%); }
  .st-blocked { border-color: var(--bad); background: var(--bad); }
  .st-blocked::after { content: ""; position: absolute; left: 1px; right: 1px; top: calc(50% - 1px); height: 2px; background: var(--panel); }
  .st-deferred { border-style: dashed; }
  .st-closed { border-color: var(--ok); background: var(--ok); }
  .s-in_progress { color: var(--accent); } .s-blocked { color: var(--bad); } .s-deferred, .s-open { color: var(--muted); } .s-closed { color: var(--ok); }
  .bad { color: var(--bad); } .held { color: var(--held); } .ok { color: var(--ok); }
  .empty { color: var(--muted); padding: var(--space-5); }
  .links-line { color: var(--muted); font-size: var(--text-sm); display: flex; flex-wrap: wrap; gap: var(--space-0) var(--space-4); }
  .links-line .open-blocker { color: var(--bad); }
  .checklist { display: flex; flex-wrap: wrap; gap: var(--space-1) var(--space-5); font-size: var(--text-base); color: var(--muted); }
  .dod ul { list-style: none; padding-left: var(--space-1); }
  .dod details:not([open]) > :not(summary) { display: none; }
  .needs { color: var(--muted); border-bottom: 1px dotted var(--muted); cursor: help; }
  .notice ul { margin: var(--space-1) 0 0; padding-left: var(--space-5); }
  .notice li b { font-weight: var(--weight-bold); }
  .label { font-size: var(--text-xs); padding: 0 var(--space-2); border-radius: var(--radius-1); background: var(--raise); color: var(--muted); }
  details.facts summary { cursor: pointer; color: var(--muted); font-size: var(--text-sm); text-transform: uppercase; letter-spacing: var(--track-label); }
  details.facts dl { display: grid; grid-template-columns: 11rem 1fr; gap: var(--space-1) var(--space-4); margin: var(--space-3) 0 0; font-size: var(--text-base); }
  details.facts dt { color: var(--muted); }
  details.facts dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
  .crumbs { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; color: var(--muted); }
  .crumbs select { padding: var(--space-0) var(--space-1); border: 1px solid var(--edge); border-radius: var(--radius-2); background: var(--panel); }
  h2.story-title { font-size: var(--text-xl); margin: var(--space-2) 0 var(--space-3); line-height: var(--leading-snug); }
  .bar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-3) var(--space-4); border: 1px solid var(--line); border-radius: var(--radius-3); background: var(--panel); margin-bottom: var(--space-5); }
  .btn { border: 1px solid var(--accent-fill); background: var(--accent-fill); color: var(--on-accent); border-radius: var(--radius-2); padding: var(--space-1) var(--space-5); cursor: pointer; }
  .btn.plain { background: transparent; color: var(--accent); }
  .btn.danger { border-color: var(--bad-fill); background: var(--bad-fill); }
  .btn:disabled { opacity: .45; cursor: default; }
  .link { all: unset; color: var(--accent); cursor: pointer; font-size: var(--text-base); }
  .link:hover { text-decoration: underline; }
  details.more { position: relative; }
  details.more summary { list-style: none; cursor: pointer; border: 1px solid var(--line); border-radius: var(--radius-2); padding: var(--space-1) var(--space-4); color: var(--muted); }
  details.more summary::-webkit-details-marker { display: none; }
  details.more:not([open]) .menu { display: none; }
  details.more .menu { position: absolute; right: 0; z-index: 5; margin-top: var(--space-1); min-width: 15rem; padding: var(--space-1); border: 1px solid var(--line); border-radius: var(--radius-3); background: var(--panel); box-shadow: var(--shadow-pop); }
  details.more .menu button { all: unset; display: block; width: 100%; box-sizing: border-box; padding: var(--space-2) var(--space-3); border-radius: var(--radius-1); cursor: pointer; }
  details.more .menu button:hover { background: var(--raise); }
  .bar select { padding: var(--space-2) var(--space-3); border: 1px solid var(--edge); border-radius: var(--radius-2); background: var(--panel); color: var(--text); }
  .picker { position: relative; flex: 1; min-width: 16rem; }
  .picker ul { position: absolute; z-index: 6; left: 0; right: 0; margin: var(--space-1) 0 0; padding: var(--space-1); list-style: none; border: 1px solid var(--line); border-radius: var(--radius-3); background: var(--panel); box-shadow: var(--shadow-pop); max-height: 18rem; overflow: auto; }
  .picker li { padding: var(--space-1) var(--space-3); border-radius: var(--radius-1); cursor: pointer; display: flex; gap: var(--space-3); align-items: baseline; }
  .picker li[aria-selected="true"], .picker li:hover { background: var(--raise); }
  .verdict { font-size: var(--text-base); flex-basis: 100%; }
  .notice { padding: var(--space-3) var(--space-4); border-radius: var(--radius-3); margin-bottom: var(--space-4); border: 1px solid var(--line); }
  .notice.note { border-color: var(--line); color: var(--text); } .notice.bad { border-color: var(--bad); }
  section.block { margin: var(--space-5) 0; }
  section.block > h3 { display: flex; align-items: baseline; gap: var(--space-4); font-size: var(--text-sm); text-transform: uppercase; letter-spacing: var(--track-label); color: var(--muted); margin: 0 0 var(--space-2); }
  .md { overflow-wrap: anywhere; }
  .md p { margin: var(--space-1) 0; } .md h4 { margin: var(--space-4) 0 var(--space-1); font-size: var(--text-md); }
  .md ul { margin: var(--space-1) 0; padding-left: var(--space-5); } .md li.check { list-style: none; margin-left: -1.2rem; }
  .md code { font-family: var(--font-mono); font-size: var(--text-sm); background: var(--raise); padding: var(--space-0) var(--space-1); border-radius: var(--radius-1); }
  .md table { border-collapse: collapse; margin: var(--space-2) 0; font-size: var(--text-sm); }
  .md th, .md td { border: 1px solid var(--line); padding: var(--space-1) var(--space-3); text-align: left; vertical-align: top; }
  .md th { background: var(--raise); }
  .md pre { background: var(--raise); padding: var(--space-3); border-radius: var(--radius-2); overflow: auto; }
  .none { color: var(--muted); font-style: italic; }
  textarea, input.field { width: 100%; padding: var(--space-3) var(--space-3); border: 1px solid var(--edge); border-radius: var(--radius-2); background: var(--panel); }
  textarea { min-height: 7rem; resize: vertical; font-family: var(--font-mono); font-size: var(--text-base); line-height: var(--leading-normal); overflow: auto; }
  textarea.tall { min-height: 10rem; }
  .form-foot { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; padding: var(--space-4) 0; background: var(--bg); border-top: 1px solid var(--line); margin-top: var(--space-3); }
  .row-actions { display: flex; gap: var(--space-3); margin-top: var(--space-2); align-items: center; }
  .links { list-style: none; margin: 0; padding: 0; }
  .links li { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: baseline; padding: var(--space-0) 0; }
  .links .kind { width: 6.5rem; flex: none; color: var(--muted); font-size: var(--text-sm); }
  .comments { list-style: none; margin: 0 0 var(--space-3); padding: 0; }
  .comments li { border-left: 3px solid var(--line); padding: var(--space-0) 0 var(--space-0) var(--space-4); margin: var(--space-3) 0; }
  .comments .who { color: var(--muted); font-size: var(--text-sm); }
  .comments .text { white-space: pre-wrap; }
  form.grid { display: grid; gap: var(--space-3); }
  form.grid details:not([open]) > :not(summary) { display: none; }
  form.grid label { display: grid; gap: var(--space-1); color: var(--muted); font-size: var(--text-base); }
  form.grid select { min-width: 10rem; padding: var(--space-2) var(--space-3); border: 1px solid var(--edge); border-radius: var(--radius-2); background: var(--panel); color: var(--text); font-size: var(--text-base); }
  .inline { display: flex; gap: var(--space-3); flex-wrap: wrap; align-items: center; }
  #toast { position: fixed; right: 1rem; bottom: 1rem; max-width: 34rem; padding: var(--space-3) var(--space-5); border-radius: var(--radius-3); background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow-pop); display: none; }
  #outage { margin: var(--space-3) var(--space-5) 0; }
  #stale { position: fixed; top: 0; left: 0; right: 0; z-index: 10; padding: var(--space-3) var(--space-5); background: var(--panel); border-bottom: 2px solid var(--bad); color: var(--bad); }
  .ready-line { padding: var(--space-2) var(--space-4); } .dod.folded summary { cursor: pointer; color: var(--muted); }
  .handoff { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: baseline; } .handoff details { flex: 1 1 100%; }
  #toast.show { display: block; } #toast.bad { border-color: var(--bad); color: var(--bad); }
  .back { display: none; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    body.reading #list-pane { display: none; }
    body:not(.reading) #detail-pane { display: none; }
    .back { display: inline-block; margin-bottom: var(--space-3); }
    #counts { display: none; }
  }
</style>

<body>
<header>
  <h1>Tracker</h1>
  <div class="picker search-box"><input id="search" type="search" placeholder="Search titles and ids   ( / )" aria-label="Search" autocomplete="off"></div>
  <div id="counts" aria-live="polite"></div>
  <button class="btn" id="new" type="button">New story</button>
</header>
<div id="outage" class="notice bad" role="alert" hidden></div>
<div id="mirror" class="notice note" role="status" hidden></div>
<main>
  <div id="list-pane">
    <div class="toolbar" id="tabs" role="toolbar" aria-label="Views"></div>
    <div class="toolbar">
      <div id="types" class="inline" role="toolbar" aria-label="Type"></div>
      <span class="grow"></span>
      <label class="meta">sort <select id="sort" class="small">
        <option value="rank">rank</option><option value="priority">priority</option>
        <option value="updated">last updated</option><option value="created">newest</option>
      </select></label>
    </div>
    <ol id="rows" aria-label="Stories"></ol>
  </div>
  <div id="detail-pane" aria-live="polite"></div>
</main>
<div id="stale" role="alert" hidden></div>
<div id="toast" role="status"></div>
<script>
"use strict";
const API = "/api/v1";
const REFINE = "refine";
const PRIORITIES = [["0", "critical"], ["1", "high"], ["2", "medium"], ["3", "low"], ["4", "backlog"]];
const STATUSES = ["open", "in_progress", "blocked", "deferred"];
const EDGE_NAMES = { blocks: "waits on", "parent-child": "is a child of", related: "is related to", "discovered-from": "was discovered from" };
const TABS = [["ready", "Ready"], ["working", "In progress"], ["refine", "Refine"], ["blocked", "Blocked"], ["mine", "Mine"], ["active", "All open"], ["closed", "Closed"]];
const LIST_CAP = 400;
const state = { dependents: new Map(), edgeTypes: ["blocks"], recordTypes: [], me: "", records: new Map(), closed: null, ready: [], refine: new Map(), blocked: new Map(), tab: "ready", type: "", sort: "rank", query: "", current: null };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs || {})) {
    if (value === undefined || value === null || value === false) continue;
    if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else if (key === "class") node.className = value;
    else node.setAttribute(key, value === true ? "" : value);
  }
  for (const child of children.flat()) if (child !== null && child !== undefined && child !== "") node.append(child);
  return node;
}

async function call(method, path, body) {
  const init = { method, headers: {} };
  if (body !== undefined) {
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(body);
  }
  const response = await fetch(API + path, init);
  const report = await response.json();
  kitBanner(document.getElementById("stale"), response.status, report.refused);
  if (report.found === false) throw new Error("no story " + (report.record || "") + " in this ledger");
  if (!response.ok || typeof report.refused === "string") throw new Error(report.refused || JSON.stringify(report.blocking || report));
  return report;
}

function kitBanner(node, status, refused) {
  const stale = status === 503 && typeof refused === "string";
  node.hidden = !stale;
  node.textContent = stale ? refused : "";
  return stale;
}

function toast(text, bad) {
  const node = document.getElementById("toast");
  node.textContent = text;
  node.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { node.className = ""; }, bad ? 9000 : 3500);
}

async function attempt(work, done) {
  try {
    await work();
    if (done) toast(done);
  } catch (error) {
    toast(error.message, true);
  }
}

function age(stamp) {
  if (!stamp) return "";
  const days = (Date.now() - Date.parse(stamp)) / 86400000;
  if (days < 1 / 24) return "now";
  if (days < 1) return Math.round(days * 24) + "h";
  if (days < 60) return Math.round(days) + "d";
  return Math.round(days / 30) + "mo";
}

const SECTIONS = {
  "Trigger": ["trigger", "the situation that causes the work: When <situation>, I want <goal>, so I can <outcome>."],
  "Acceptance Criteria": ["acceptance criteria", "checks that prove the work is done, one per line: - [ ] <a check a person can run>. Verify checks them."],
  "Requirements": ["requirements", "what the solution must hold to, for example: standard library only. Validation judges the result against them."],
  "Steps to Reproduce": ["steps to reproduce", "the steps that make the bug happen, one per line."],
  "Success Criteria": ["success criteria", "what must be true when the whole epic is done."],
};

function sectionOf(name) {
  const bare = name.replace(/^## /, "");
  return [bare, ...(SECTIONS[bare] || [bare.toLowerCase(), "a section the template for this type requires."])];
}

function needs(names) {
  const parts = (names || []).map(sectionOf);
  return el("span", { class: "needs", title: parts.map(([bare, , what]) => bare + ": " + what).join("\n") }, "needs " + stillNeeds(names));
}

function doneBlock(shown) {
  const f = shown.fields;
  const process = shown.process;
  if (process) {
    const review = process.review || {};
    const confirmation = process.confirmation || {};
    const reviewed = Boolean(process.revision && review.revision === process.revision && !(process.owed || []).length);
    const confirmed = reviewed && confirmation.revision === process.revision;
    const details = el("details", {}, el("summary", {}, "Review and confirmation · Review: " + (reviewed ? "recorded for this card" : "required") + ". Confirmation: " + (confirmed ? "recorded for this card" : "required") + "."));
    if (review.revision && !reviewed) details.append(el("p", {}, "The saved review does not cover the current card. Refine it with an agent."));
    if (review.invest) details.append(el("ul", {}, Object.entries(review.invest).map(([name, reason]) => el("li", {}, el("b", {}, name), ": " + reason))));
    if (review.conversation && review.conversation.length) details.append(el("p", {}, "Conversation references: " + review.conversation.join(", ")));
    const results = new Map((confirmation.checks || []).map((check) => [check.criterion, check]));
    details.append(el("ul", {}, (review.checks || []).map((check) => {
      const result = results.get(check.criterion);
      return el("li", {}, el("b", {}, check.criterion),
        el("p", {}, "Expected: " + check.expected),
        el("p", {}, "Command: " + JSON.stringify(check.command)),
        result ? el("p", {}, "Recorded result: " + result.result + " (exit " + result.exit_code + ")" + (confirmed ? "" : "; current confirmation required")) : el("p", {}, "No observed result recorded."));
    })));
    if (reviewed && confirmed) details.append(el("p", {}, "Review the recorded evidence before closing as completed."));
    return el("div", { class: "dod folded" }, details);
  }
  const item = (present, name, what) => el("li", {}, el("b", {}, name), ": " + (present ? "available" : "missing") + ". " + what);
  return el("div", { class: "notice note dod" }, "Confirmation needs review and recorded evidence; available fields do not prove completion:",
    el("ul", {}, [
      item(Boolean(String(f.acceptance_criteria || "").trim()), "acceptance criteria", "check each one against the result"),
      item(Boolean(String(f.requirements || "").trim()), "requirements", "check the result against its intended use"),
    ]));
}

function needsList(names) {
  return el("ul", {}, (names || []).map(sectionOf).map(([bare, , what]) => el("li", {}, el("b", {}, bare), ": " + what)));
}

function writer(raw) {
  const [kind, rest] = String(raw || "").split(":");
  if (kind === "agent" && rest) return "agent · " + rest.split("_")[0];
  return kind || "unknown";
}

function person(name) {
  if (!name) return "";
  return name === state.me ? "you" : name;
}

function outage(message) {
  const node = document.getElementById("outage");
  node.textContent = message ? "The board cannot read the tracker: " + message : "";
  node.hidden = !message;
}

async function load() {
  const version = await call("GET", "/version").then((stamp) => stamp.version, () => "");
  const [index, ready, blocked, refine, ...lists] = await Promise.all([
    call("GET", ""), call("GET", "/ready?limit=5000"), call("GET", "/blocked"), call("GET", "/refine"),
    ...STATUSES.map((status) => call("GET", "/records?status=" + status)),
  ]).catch((error) => {
    outage(error.message);
    throw error;
  });
  outage("");
  state.version = version;
  state.me = index.holder || "";
  state.edgeTypes = index.edge_types || state.edgeTypes;
  state.recordTypes = index.record_types || state.recordTypes;
  state.records = new Map(lists.flatMap((list) => list.records).map((one) => [one.record, one]));
  state.dependents = new Map();
  for (const one of state.records.values()) {
    for (const edge of one.dependencies || []) {
      if (!state.dependents.has(edge.id)) state.dependents.set(edge.id, []);
      state.dependents.get(edge.id).push({ id: one.record, dependency_type: edge.dependency_type });
    }
  }
  state.ready = ready.records;
  state.blocked = new Map(blocked.records.map((one) => [one.record, one]));
  state.refine = new Map(refine.records.map((one) => [one.record, one]));
  if (!state.loaded && !state.ready.length && state.records.size) state.tab = "active";
  state.loaded = true;
  drawMirror(index.mirror);
  drawCounts();
  drawList();
}

function drawMirror(mirror) {
  const node = document.getElementById("mirror");
  node.textContent = mirror ? "This ledger mirrors " + mirror.source + " from " + mirror.export
    + ". " + mirror.source + " stays the source of truth: sync re-imports it, and its status wins." : "";
  node.hidden = !mirror;
}

function drawCounts() {
  const counts = [["ready", state.ready.length], ["in progress", [...state.records.values()].filter(working).length], ["refine", state.refine.size], ["blocked", state.blocked.size], ["open", state.records.size]];
  document.getElementById("counts").replaceChildren(...counts.map(([name, value]) => el("span", {}, el("b", {}, String(value)), " " + name)));
}

function working(record) {
  return record.status === "in_progress";
}

function mine(record) {
  return Boolean(state.me) && record.fields.assignee === state.me;
}

function population() {
  const records = state.records;
  if (state.tab === "ready") return state.ready.map((row) => ({ id: row.record, rank: row.rank, record: records.get(row.record) }));
  if (state.tab === "refine") return [...state.refine.values()].map((row) => ({ id: row.record, record: records.get(row.record) }));
  if (state.tab === "blocked") return [...state.blocked.values()].map((row) => ({ id: row.record, record: records.get(row.record) }));
  if (state.tab === "working") return [...records.values()].filter(working).map((record) => ({ id: record.record, record }));
  if (state.tab === "mine") return [...records.values()].filter(mine).map((record) => ({ id: record.record, record }));
  if (state.tab === "closed") return (state.closed || []).map((record) => ({ id: record.record, record }));
  return [...records.values()].map((record) => ({ id: record.record, record }));
}

function sortKey(item) {
  const record = item.record || { fields: {}, dates: {} };
  const dates = record.dates || {};
  const priority = Number(record.fields.priority ?? 9);
  if (state.sort === "priority") return [priority, item.rank ?? 1e9];
  if (state.sort === "updated") return [-(Date.parse(dates.updated) || 0)];
  if (state.sort === "created") return [-(Date.parse(dates.created) || 0)];
  if (state.tab === "closed") return [-(Date.parse(dates.closed || dates.updated) || 0)];
  return [item.rank ?? priority * 1e6];
}

function compare(a, b) {
  const left = sortKey(a), right = sortKey(b);
  for (let i = 0; i < left.length; i++) if (left[i] !== right[i]) return left[i] - right[i];
  return a.id < b.id ? -1 : 1;
}

function badge(item) {
  const record = item.record || {};
  if (record.contested && record.contested.length) return el("span", { class: "bad" }, "contested");
  const refine = state.refine.get(item.id);
  if (refine && refine.blocking.length) return needs(refine.blocking);
  if (refine && refine.labelled) return el("span", { class: "needs", title: "a person wrote or changed it, so an agent reviews it before it is ready" }, "needs agent review");
  return null;
}

function named(ids) {
  return ids.map((id) => id + "  " + String((state.records.get(id) || { fields: {} }).fields.title || "")).join("\n");
}

function few(ids) {
  return ids.slice(0, 2).join(", ") + (ids.length > 2 ? " +" + (ids.length - 2) : "");
}

function linksLine(item) {
  const record = item.record;
  if (!record) return null;
  const own = record.dependencies || [];
  const theirs = state.dependents.get(item.id) || [];
  const typed = (list, type) => list.filter((edge) => edge.dependency_type === type).map((edge) => edge.id);
  const waiting = typed(own, "blocks");
  const openWaits = waiting.filter((id) => state.records.has(id));
  const done = waiting.length - openWaits.length;
  const parts = [];
  if (openWaits.length) parts.push(el("span", { class: "open-blocker", title: named(waiting) }, "waits on " + few(openWaits) + (done ? " (+" + done + " done)" : "")));
  else if (done) parts.push(el("span", { title: waiting.join("\n") }, done === 1 ? "blocker done" : "blockers done"));
  const blocking = typed(theirs, "blocks");
  if (blocking.length) parts.push(el("span", { title: named(blocking) }, "blocks " + few(blocking)));
  const parent = typed(own, "parent-child");
  if (parent.length) parts.push(el("span", {}, "child of " + parent.join(", ")));
  const children = typed(theirs, "parent-child");
  if (children.length) parts.push(el("span", { title: named(children) }, children.length + (children.length === 1 ? " child" : " children")));
  const related = [...typed(own, "related"), ...typed(theirs, "related"), ...typed(own, "discovered-from")];
  if (related.length) parts.push(el("span", { title: named(related) }, related.length + " related"));
  const labels = labelsOf(record.fields.labels).filter((label) => label !== REFINE);
  for (const label of labels.slice(0, 4)) parts.push(el("span", { class: "label" }, label));
  return parts.length ? el("span", { class: "links-line" }, parts) : null;
}

async function closedRecords() {
  if (!state.closed) state.closed = (await call("GET", "/records?status=closed")).records;
  return state.closed;
}

async function pick(key) {
  const hash = routeHash(key, state.current && state.current.record);
  if (location.hash !== hash) location.hash = hash;
  else await showView(key);
}

async function showView(key) {
  state.tab = key;
  if (key === "closed") await attempt(closedRecords);
  drawList();
}

function drawTabs() {
  const sizes = { working: [...state.records.values()].filter(working).length, ready: state.ready.length, refine: state.refine.size, blocked: state.blocked.size, mine: [...state.records.values()].filter(mine).length, active: state.records.size, closed: state.closed ? state.closed.length : null };
  document.getElementById("tabs").replaceChildren(...TABS.map(([key, name]) => el("button", {
    class: "tab", type: "button", "aria-pressed": String(state.tab === key), onclick: () => pick(key),
  }, name, sizes[key] === null ? null : el("span", { class: "n" }, String(sizes[key])))));
  document.getElementById("types").replaceChildren(...[["", "all types"], ...state.recordTypes.map((t) => [t, t])].map(([key, name]) => el("button", {
    class: "chip", type: "button", "aria-pressed": String(state.type === key), onclick: () => { state.type = key; drawList(); },
  }, name)));
}

const STATUS_NAMES = { open: "open", in_progress: "in progress", blocked: "blocked", deferred: "deferred", closed: "closed" };

function statusMark(status, record) {
  const waits = status === "open" && record ? (record.dependencies || []).filter((edge) => edge.dependency_type === "blocks" && state.records.has(edge.id)).map((edge) => edge.id) : [];
  const shown = waits.length ? "blocked" : status;
  const name = waits.length ? "open, waits on " + waits.join(", ") : STATUS_NAMES[status] || status || "unknown";
  return el("span", { class: "st st-" + shown, role: "img", "aria-label": "status: " + name, title: name });
}

function typePill(type) {
  return el("span", { class: "pill t-" + type }, type);
}

function priorityPill(priority, long) {
  const known = PRIORITIES.find(([key]) => key === String(priority ?? ""));
  if (!known) return el("span", { class: "pill pr-" }, "no priority");
  return el("span", { class: "pill pr" + known[0], title: known[1] }, "P" + known[0] + (long ? " " + known[1] : ""));
}

function row(item) {
  const record = item.record || { fields: {}, dates: {} };
  const holder = person(record.fields.assignee);
  return el("li", {}, el("button", {
    type: "button", "aria-current": String(Boolean(state.current) && state.current.record === item.id), onclick: () => go(item.id),
  },
  statusMark(record.status, record),
  el("span", { class: "title" }, String(record.fields.title || item.id)),
  el("span", { class: "meta" },
    priorityPill(record.fields.priority),
    holder ? el("span", { class: "held" }, holder) : null,
    badge(item),
    record.fields.issue_type ? typePill(record.fields.issue_type) : null,
    record.dates && record.dates.updated ? el("span", { title: "last updated " + record.dates.updated }, age(record.dates.updated)) : null,
    el("span", { class: "id" }, item.id)),
  linksLine(item)));
}

function drawList() {
  drawTabs();
  const query = state.query.toLowerCase();
  const items = population().filter((item) => {
    const fields = item.record ? item.record.fields : {};
    if (state.type && fields.issue_type !== state.type) return false;
    return !query || item.id.toLowerCase().includes(query) || String(fields.title || "").toLowerCase().includes(query);
  }).sort(compare);
  const rows = items.slice(0, LIST_CAP).map(row);
  if (items.length > rows.length) rows.push(el("li", { class: "empty" }, `${items.length - rows.length} more: search or filter to narrow the list`));
  if (!rows.length) rows.push(el("li", { class: "empty" }, state.tab === "mine" && !state.me ? "set git config user.name so the tracker knows who you are" : "nothing here"));
  document.getElementById("rows").replaceChildren(...rows);
}

function strong(text) {
  return text.split(/(\*\*[^*]+\*\*)/).map((part) => part.length > 4 && part.startsWith("**") && part.endsWith("**") ? el("strong", {}, part.slice(2, -2)) : part);
}

function inline(text) {
  return String(text).split(/(`[^`]+`)/).flatMap((part) => part.length > 1 && part.startsWith("`") && part.endsWith("`") ? [el("code", {}, part.slice(1, -1))] : strong(part));
}

function cells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((cell) => cell.trim());
}

function markdown(text) {
  const root = el("div", { class: "md" });
  let list = null, fence = null, table = null, para = [];
  const flush = () => { if (para.length) root.append(el("p", {}, inline(para.join(" ")))); para = []; };
  for (const raw of String(text || "").split("\n")) {
    const line = raw.trimEnd();
    if (fence !== null) {
      if (line.trim().startsWith("```")) { root.append(el("pre", {}, el("code", {}, fence.join("\n")))); fence = null; } else fence.push(raw);
      continue;
    }
    if (line.trim().startsWith("```")) { flush(); list = null; table = null; fence = []; continue; }
    if (line.trim().startsWith("|")) {
      flush(); list = null;
      if (/^\|[\s:|-]+\|?$/.test(line.trim())) continue;
      const row = el("tr", {}, cells(line).map((cell) => el(table ? "td" : "th", {}, inline(cell))));
      if (!table) { table = el("table"); root.append(table); }
      table.append(row);
      continue;
    }
    table = null;
    const heading = line.match(/^#{1,6}\s+(.*)$/);
    const item = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
    if (heading) { flush(); list = null; root.append(el("h4", {}, inline(heading[1]))); continue; }
    if (item) {
      flush();
      if (!list) { list = el("ul"); root.append(list); }
      const box = item[1].match(/^\[( |x|X)\]\s*(.*)$/);
      list.append(box ? el("li", { class: "check" }, box[1] === " " ? "☐ " : "☑ ", inline(box[2])) : el("li", {}, inline(item[1])));
      continue;
    }
    if (!line.trim()) { flush(); list = null; continue; }
    if (list && /^\s+/.test(raw)) { list.lastChild.append(" ", ...inline(line.trim())); continue; }
    list = null;
    para.push(line.trim());
  }
  if (fence !== null) root.append(el("pre", {}, el("code", {}, fence.join("\n"))));
  flush();
  return root;
}

function go(record) {
  const hash = routeHash(state.tab, record);
  if (location.hash !== hash) location.hash = hash;
  else open(record);
}

async function act(action, body, done) {
  const record = state.current.record;
  await attempt(async () => {
    await call("POST", "/records/" + encodeURIComponent(record) + "/" + action, body);
    await load();
    await open(record);
  }, done);
}

function select(options, value, onchange, unset) {
  const known = options.some(([key]) => String(key) === String(value));
  return el("select", { onchange: (event) => onchange(event.target.value) },
    known || !unset ? null : el("option", { value: "", selected: true, disabled: true }, unset),
    ...options.map(([key, name]) => el("option", { value: key, selected: String(key) === String(value) }, name)));
}

function section(title, value, placeholder) {
  return el("section", { class: "block" }, el("h3", {}, title),
    value && String(value).trim() ? markdown(value) : el("div", { class: "none" }, placeholder));
}

function grow(area) {
  const fit = () => { area.style.height = "auto"; area.style.height = area.scrollHeight + 2 + "px"; };
  area.addEventListener("input", fit);
  requestAnimationFrame(fit);
  return area;
}

const CONTENT = ["title", "description", "acceptance", "requirements"];

function suggest(input, { source, choose, render }) {
  const list = el("ul", { role: "listbox", hidden: true });
  let found = [], active = 0;
  input.setAttribute("role", "combobox");
  input.setAttribute("autocomplete", "off");
  input.setAttribute("aria-expanded", "false");
  const hide = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); };
  const draw = () => {
    list.replaceChildren(...found.map((item, index) => el("li", { role: "option", "aria-selected": String(index === active), onmousedown: (event) => { event.preventDefault(); hide(); choose(item); } }, render(item))));
    list.hidden = !found.length;
    input.setAttribute("aria-expanded", String(!list.hidden));
  };
  input.addEventListener("input", async () => { found = await source(input.value); active = 0; draw(); });
  input.addEventListener("keydown", (event) => {
    if (list.hidden) return;
    if (event.key === "ArrowDown" || event.key === "ArrowUp") { event.preventDefault(); active = (active + (event.key === "ArrowDown" ? 1 : found.length - 1)) % found.length; draw(); }
    if (event.key === "Enter" && found[active]) { event.preventDefault(); event.stopImmediatePropagation(); hide(); choose(found[active]); }
    if (event.key === "Escape") hide();
  });
  input.addEventListener("blur", hide);
  return list;
}

function storyRow(one) {
  return [statusMark(one.status), el("span", { class: "id" }, one.record), el("span", {}, String(one.fields.title || ""))];
}

function matching(query, except) {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const pool = [...state.records.values(), ...(state.closed || [])];
  return pool.filter((one) => one.record !== except && words.every((word) =>
    one.record.toLowerCase().includes(word) || String(one.fields.title || "").toLowerCase().includes(word))).slice(0, 8);
}

function labelsOf(value) {
  return (Array.isArray(value) ? value : String(value || "").split(",")).map((one) => String(one).trim()).filter(Boolean);
}

function knownLabels() {
  return [...new Set([...state.records.values(), ...(state.closed || [])].flatMap((one) => labelsOf(one.fields.labels)))].sort();
}

function knownHolders() {
  return [...new Set([state.me, ...[...state.records.values(), ...(state.closed || [])].map((one) => String(one.fields.assignee || ""))].filter(Boolean))].sort();
}

function labelInput(value) {
  const input = el("input", { class: "field", name: "labels", value: labelsOf(value).join(", "), placeholder: "comma-separated, for example phase-1, kit" });
  const list = suggest(input, {
    source: (text) => {
      const parts = text.split(",");
      const last = parts[parts.length - 1].trim().toLowerCase();
      const taken = new Set(parts.slice(0, -1).map((one) => one.trim()));
      return knownLabels().filter((label) => !taken.has(label) && (!last || label.toLowerCase().includes(last))).slice(0, 8);
    },
    choose: (label) => {
      const parts = input.value.split(",").slice(0, -1).map((one) => one.trim()).filter(Boolean);
      input.value = [...parts, label].join(", ") + ", ";
      input.focus();
    },
    render: (label) => el("span", {}, label),
  });
  return el("div", { class: "picker" }, input, list);
}

const templates = new Map();

async function templateFor(type) {
  if (!templates.has(type)) templates.set(type, call("GET", "/scaffold?type=" + encodeURIComponent(type)));
  return templates.get(type);
}

async function drawChecklist(box, type) {
  try {
    const { required } = await templateFor(type || "task");
    box.replaceChildren(el("span", {}, "Before work starts, a " + (type || "task") + " needs:"), ...(required || []).map((name) => {
      const [bare, short, what] = sectionOf(name);
      return el("span", { title: bare + ": " + what }, short);
    }), el("span", {}, "Capture now; saved-card readiness comes from the tracker."));
  } catch (error) {
    box.textContent = "Readiness template unavailable: " + error.message + ". You can still capture an idea.";
  }
}

function storyForm(values, { status, submit, cancel, note, draft, revision }) {
  try {
    const saved = draft && localStorage.getItem("tracker-draft:" + draft);
    if (saved) {
      const retained = JSON.parse(saved);
      values = { ...values, ...retained.values };
      revision = retained.revision ?? revision;
    }
  } catch (error) { toast("The browser could not restore this draft: " + error.message, true); }
  const checklist = el("div", { class: "checklist", "aria-live": "polite" });
  const type = select(state.recordTypes.map((t) => [t, t]), values.issue_type, () => drawChecklist(checklist, type.value), "no type");
  const priority = select(PRIORITIES.map(([key, name]) => [key, "P" + key + " " + name]), values.priority, () => {}, "no priority");
  const state_ = status ? select(STATUSES.map((one) => [one, one.replace("_", " ")]), values.status || status, () => {}) : null;
  const area = (name, text, placeholder, tall) => grow(el("textarea", { name, placeholder, class: tall ? "tall" : null }, String(text || "")));
  const form = el("form", { class: "grid" },
    el("label", {}, "Title", el("input", { class: "field", name: "title", required: true, value: String(values.title || "") })),
    el("div", { class: "inline" }, el("label", {}, "Type", type), el("label", {}, "Priority", priority), state_ ? el("label", {}, "Status", state_) : null),
    el("label", {}, "Labels", labelInput(values.labels)),
    el("label", {}, "Idea / context", area("description", values.description, "Capture what you know. An agent can help shape the story later.", true)),
    el("details", { open: Boolean(status) }, el("summary", {}, "Refinement details · optional for capture"),
    el("label", {}, "Acceptance criteria", area("acceptance", values.acceptance, "- [ ] a check a person can run")),
    el("label", {}, "Requirements", area("requirements", values.requirements, "- what the solution must hold to")),
    checklist),
    el("div", { class: "form-foot" }, el("button", { class: "btn", type: "submit" }, submit),
      el("button", { class: "btn plain", type: "button", onclick: cancel }, "Cancel"),
      el("span", { class: "meta", role: "status", "aria-live": "polite" }, note + "  ·  Ctrl+Enter saves")));
  form.addEventListener("keydown", (event) => { if (event.key === "Enter" && (event.ctrlKey || event.metaKey)) form.requestSubmit(); });
  form.addEventListener("input", () => drawChecklist(checklist, type.value));
  drawChecklist(checklist, type.value);
  form.read = () => ({
    title: form.title.value, description: form.description.value, acceptance: form.acceptance.value, requirements: form.requirements.value,
    issue_type: type.value, priority: priority.value, status: state_ ? state_.value : undefined,
    labels: labelsOf(form.labels.value),
  });
  if (draft) form.addEventListener("input", () => {
    try { localStorage.setItem("tracker-draft:" + draft, JSON.stringify({ values: form.read(), revision: form.revision })); }
    catch (error) { toast("The browser could not retain this draft: " + error.message, true); }
  });
  form.draft = draft;
  form.revision = revision;
  return form;
}

function edit(shown) {
  const f = shown.fields;
  const before = { title: f.title, description: f.description, acceptance: f.acceptance_criteria, requirements: f.requirements, issue_type: f.issue_type, priority: f.priority, labels: labelsOf(f.labels) };
  const form = storyForm(before, { status: shown.status, submit: "Save", cancel: () => open(shown.record), draft: shown.record, revision: shown.max_seq, note: "Draft retained in this browser. Text changes ask for agent review." });
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const after = form.read();
    const body = {};
    for (const key of CONTENT) if (String(after[key] || "") !== String(before[key] || "")) body[key] = after[key];
    const fields = {};
    if (after.issue_type && after.issue_type !== before.issue_type) fields.issue_type = after.issue_type;
    if (after.priority !== "" && String(after.priority) !== String(before.priority ?? "")) fields.priority = Number(after.priority);
    if (Object.keys(fields).length) body.fields = fields;
    if (after.status !== shown.status) body.status = after.status;
    const text = CONTENT.some((key) => key in body);
    const added = after.labels.filter((label) => !before.labels.includes(label));
    const removed = before.labels.filter((label) => !after.labels.includes(label));
    if (text && !after.labels.includes(REFINE)) added.push(REFINE);
    if (added.length) body.add_labels = added;
    if (removed.length) body.remove_labels = removed;
    if (!Object.keys(body).length) return open(shown.record);
    body.if_seq = form.revision;
    saveEdit(form, shown.record, body, text ? "saved; an agent refinement pass owes it before it is ready" : "saved");
  });
  document.getElementById("detail-pane").replaceChildren(
    el("div", { class: "crumbs" }, el("span", { class: "id" }, shown.record), el("span", {}, "editing")), form);
  form.title.focus();
}

async function saveEdit(form, record, body, done) {
  if (form.dataset.pending) return;
  pendingForm(form, "Saving…");
  try {
    await call("PATCH", "/records/" + encodeURIComponent(record), body);
  } catch (error) {
    pendingForm(form, "Save", false);
    form.querySelector("[role=status]").textContent = "Save failed: " + error.message + ". Your draft is retained; retry or cancel.";
    form.querySelector(".notice")?.remove();
    form.prepend(el("div", { class: "notice bad" }, "To start again from the current saved card, ",
      el("button", { class: "link", type: "button", onclick: () => { clearDraft(form.draft); open(record); } }, "Discard my retained draft and reload")));
    return;
  }
  clearDraft(form.draft);
  await open(record);
  toast(done);
  load().catch((error) => toast("Saved. The list could not refresh: " + error.message, true));
}

function assignForm(bar, shown, cancel) {
  const held = shown.holder && shown.holder.name;
  const input = el("input", { class: "field", placeholder: "a name, as git config user.name gives it" });
  const list = suggest(input, {
    source: (text) => knownHolders().filter((name) => name.toLowerCase().includes(text.trim().toLowerCase())).slice(0, 8),
    choose: (name) => { input.value = name; judge(); },
    render: (name) => el("span", {}, name === state.me ? name + " (you)" : name),
  });
  const button = el("button", { class: "btn", type: "button", disabled: true }, "Assign");
  const judge = () => {
    const name = input.value.trim();
    const taking = Boolean(held) && held !== name;
    button.disabled = !name || name === held;
    button.className = taking ? "btn danger" : "btn";
    button.textContent = taking ? "Take from " + held + " and assign" : "Assign";
    button.onclick = () => act("assign", taking ? { to: name, take: true } : { to: name }, "assigned to " + name);
  };
  input.addEventListener("input", judge);
  bar.replaceChildren(el("span", { class: "meta" }, "Assign to"), el("div", { class: "picker" }, input, list), button, cancel);
  input.focus();
}

function since(held) {
  return held.since ? " since " + held.since.slice(0, 10) : "";
}

function actionsBar(shown, waiting) {
  const held = shown.holder && shown.holder.name;
  const yours = Boolean(held) && held === state.me;
  const bar = el("div", { class: "bar" });
  const menu = el("div", { class: "menu" });
  const more = el("details", { class: "more" }, el("summary", {}, "More ▾"), menu);
  const item = (label, handler) => menu.append(el("button", { type: "button", onclick: () => { more.open = false; handler(); } }, label));
  const cancel = () => el("button", { class: "btn plain", type: "button", onclick: () => open(shown.record) }, "Cancel");
  const closeForm = () => {
    const resolution = el("select", { class: "field", "aria-label": "Closure outcome" },
      el("option", { value: "completed" }, "Completed: work delivered"),
      el("option", { value: "cancelled" }, "Cancelled: work no longer needed"));
    const reason = el("input", { class: "field", "aria-label": "Closure reason" });
    const explanation = el("span", { class: "meta" });
    const submit = el("button", { class: "btn", type: "button", disabled: true, onclick: () => act("close", { reason: reason.value, resolution: resolution.value }, "closed as " + resolution.value) }, "Close as completed");
    const judge = () => {
      const cancelled = resolution.value === "cancelled";
      reason.placeholder = cancelled ? "Why is this work no longer needed?" : "What shipped and what evidence confirms it?";
      explanation.textContent = cancelled ? "Cancellation preserves the idea and its history. It does not satisfy dependencies." : "Completion requires the current review and recorded results for every planned check.";
      submit.textContent = cancelled ? "Cancel work" : "Close as completed";
      submit.disabled = !reason.value.trim();
    };
    resolution.addEventListener("change", judge);
    reason.addEventListener("input", judge);
    judge();
    bar.replaceChildren(resolution, reason, explanation, submit, cancel());
    reason.focus();
  };
  if (!held) {
    bar.append(el("span", { class: "meta" }, "Nobody holds this story."),
      el("button", { class: "btn", type: "button", disabled: Boolean(waiting), title: waiting || "take it and start", onclick: () => act("claim", {}, "claimed: it is yours and in progress") }, "Claim"));
    item("Reserve for later (assign to me)", () => act("assign", {}, "reserved for you"));
  } else if (yours) {
    bar.append(el("span", { class: "held" }, "● You hold this story" + since(shown.holder)),
      el("button", { class: "btn", type: "button", onclick: closeForm }, "Close…"));
    item("Release it (unassign)", () => act("unassign", {}, "released"));
  } else {
    bar.append(el("span", { class: "held" }, "● Held by " + held + since(shown.holder) + (shown.holder.stale ? " (stale)" : "")),
      el("button", { class: "btn", type: "button", disabled: true, title: "ask them first" }, "Claim"));
    item("Take over from " + held + "…", () => {
      bar.replaceChildren(el("span", { class: "bad" }, "Take the story from " + held + "? The ledger records that you took it."),
        el("button", { class: "btn danger", type: "button", onclick: () => act("claim", { take: true }, "taken over") }, "Take over"), cancel());
    });
  }
  if (!yours) item("Close…", closeForm);
  item("Assign to someone…", () => assignForm(bar, shown, cancel()));
  item("Add a dependency…", () => dependencyForm(bar, shown, cancel()));
  bar.append(el("span", { class: "grow" }), el("button", { class: "btn plain", type: "button", title: "edit the story (e)", onclick: () => edit(shown) }, "Edit"), more);
  return bar;
}

function dependencyVerdict(shown, target, type) {
  if (!target) return ["", "type an id or words from a title, then pick a story"];
  if (target.record === shown.record) return ["bad", "a story cannot depend on itself"];
  if (shown.dependencies.some((edge) => edge.id === target.record && edge.dependency_type === type)) return ["bad", "this story already " + EDGE_NAMES[type] + " " + target.record];
  if (type === "blocks" && target.status === "closed") return ["bad", target.record + " is closed, so waiting on it holds nothing back; pick an open story, or use is related to"];
  return ["ok", "this story " + (EDGE_NAMES[type] || type) + " " + target.record + ": " + String(target.fields.title || "")];
}

function dependencyForm(bar, shown, cancel) {
  let picked = null;
  const loading = closedRecords().catch(() => []);
  const kind = select(state.edgeTypes.map((type) => [type, EDGE_NAMES[type] || type]), "blocks", () => judge());
  const input = el("input", { class: "field", placeholder: "id or title words" });
  const verdict = el("div", { class: "verdict meta" });
  const add = el("button", { class: "btn", type: "button", disabled: true, onclick: () => act("deps", { target: picked.record, type: kind.value }, "dependency recorded") }, "Add");
  const judge = () => {
    const [tone, text] = dependencyVerdict(shown, picked, kind.value);
    verdict.className = "verdict " + (tone || "meta");
    verdict.textContent = text;
    add.disabled = tone !== "ok";
  };
  const list = suggest(input, {
    source: async (text) => {
      picked = null;
      const query = text.trim();
      await loading;
      let found = matching(query, shown.record);
      if (!found.length && /^[\w.-]+-[\w.]+$/.test(query)) {
        try { found = [await call("GET", "/records/" + encodeURIComponent(query))]; } catch (error) { found = []; }
      }
      judge();
      if (query && !found.length) { verdict.className = "verdict bad"; verdict.textContent = "no story matches " + query; }
      return found;
    },
    choose: (one) => { picked = one; input.value = one.record + "  " + String(one.fields.title || ""); judge(); },
    render: storyRow,
  });
  input.addEventListener("keydown", (event) => { if (event.key === "Enter" && !add.disabled) { event.preventDefault(); add.click(); } });
  bar.replaceChildren(el("span", { class: "meta" }, "This story"), kind, el("div", { class: "picker" }, input, list), add, cancel, verdict);
  judge();
  input.focus();
}

function linkRow(kind, id, title, status, removal) {
  const row = el("li", {}, el("span", { class: "kind" }, kind),
    el("button", { class: "link", type: "button", onclick: () => go(id) }, id),
    el("span", {}, title || ""), status && status !== "open" ? el("span", { class: "meta" }, status.replace("_", " ")) : null);
  if (removal) {
    const remove = el("button", { class: "link", type: "button", title: "retract this dependency" }, "remove");
    remove.addEventListener("click", () => remove.replaceWith(el("span", { class: "inline" },
      el("span", { class: "bad" }, "Remove this link?"),
      el("button", { class: "btn danger", type: "button", onclick: removal }, "Remove"),
      el("button", { class: "btn plain", type: "button", onclick: () => open(state.current.record) }, "Keep"))));
    row.append(el("span", { class: "grow" }), remove);
  }
  return row;
}

function linksBlock(shown) {
  const named = { "parent-child": ["parent", "child"], blocks: ["waits on", "blocks"] };
  const rows = [
    ...shown.dependencies.map((edge) => linkRow((named[edge.dependency_type] || [edge.dependency_type])[0], edge.id, edge.title, edge.status,
      edge.dependency_type === "parent-child" ? null : () => act("undep", { target: edge.id, type: edge.dependency_type }, "link removed"))),
    ...shown.dependents.map((edge) => linkRow((named[edge.dependency_type] || [, edge.dependency_type])[1], edge.id, edge.title, edge.status)),
  ];
  return el("section", { class: "block" }, el("h3", {}, "Links"), rows.length ? el("ul", { class: "links" }, rows) : el("div", { class: "none" }, "no links"));
}

const IMPORTED = ["design", "notes", "created_by", "owner", "source_repo", "imported_from", "created_at", "updated_at", "closed_at"];

function factsBlock(shown) {
  const f = shown.fields;
  const dates = shown.dates || {};
  const rows = [
    ["created", dates.created], ["assigned", dates.assigned], ["updated", dates.updated], ["closed", dates.closed],
    ["external_ref", f.external_ref], ["shaped under", f.shaped_under],
    ["checkpoints", Object.keys(shown.checkpoints || {}).length ? JSON.stringify(shown.checkpoints) : ""],
    ["artifacts", Object.keys(shown.artifacts || {}).join(", ")],
    ["tokens", shown.totals && Object.values(shown.totals).some(Boolean) ? JSON.stringify(shown.totals) : ""],
    ...IMPORTED.map((name) => ["imported " + name, f[name]]),
  ].filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== "");
  return el("details", { class: "facts block" }, el("summary", {}, "Details"),
    el("dl", {}, rows.flatMap(([name, value]) => [el("dt", {}, name), el("dd", {}, String(value))])));
}

function commentsBlock(shown) {
  const log = shown.comment_log || shown.comments.map((text) => ({ text }));
  const text = el("textarea", { placeholder: "Add a comment", style: "min-height: 5rem" });
  return el("section", { class: "block" }, el("h3", {}, "Conversation", el("span", {}, String(log.length))),
    el("ul", { class: "comments" }, log.map((one) => el("li", {},
      one.writer ? el("div", { class: "who" }, writer(one.writer) + (one.at ? " · " + one.at.slice(0, 16).replace("T", " ") : "")) : null,
      el("div", { class: "text" }, one.text)))),
    text, el("div", { class: "row-actions" }, el("button", { class: "btn plain", type: "button", onclick: () => act("comments", { text: text.value }, "comment added") }, "Comment")));
}

function refinementBlock(shown, dor) {
  const missing = (dor.blocking || []).map((name) => sectionOf(name)[0]);
  const prompt = "Refine tracker record " + shown.record + ". Read its card and conversation using the installed tracker CLI. Preserve the person's raw context. Ask about missing facts instead of inventing them. Use the review form allowed by the current tracker guidance. Shape its trigger, requirements and acceptance criteria into the typed fields. "
    + (missing.length ? "The tracker currently requires: " + missing.join(", ") + ". " : "")
    + "Keep the card and confirmation linked: record questions and decisions when needed, and make each acceptance criterion a planned check. Re-read authoritative readiness after updating; clear the refine label only after agent review.";
  const text = grow(el("textarea", { readonly: true, "aria-label": "Agent refinement handoff" }, prompt));
  const copy = el("button", { class: "btn plain", type: "button", onclick: async () => {
    text.select();
    try { await navigator.clipboard.writeText(prompt); toast("Agent handoff copied"); }
    catch (error) { toast("Select and copy the handoff text: " + error.message, true); }
  } }, "Copy agent handoff");
  return el("section", { class: "block handoff" }, copy,
    el("details", {}, el("summary", {}, "Show handoff text"), text));
}

function notices(shown, dor) {
  const found = [];
  const labels = String(shown.fields.labels || "").split(",").map((one) => one.trim());
  if (shown.conflicts && shown.conflicts.length) found.push(el("div", { class: "notice bad" }, "Two branches set different values: " + shown.conflicts.map((c) => c.key + " = " + c.values.join(" / ")).join("; ") + ". Run the kit's resolve command to keep the current value."));
  const needs = shown.status !== "closed" ? stillNeeds(dor.blocking) : "";
  if (labels.includes(REFINE) || needs) found.push(el("div", { class: "notice note ready-line" }, "Not ready: needs " + (needs || "an agent review") + ". Copy the agent handoff below the story to refine it."));
  if (shown.status !== "closed" || (shown.process && shown.process.review && shown.process.review.revision)) found.push(doneBlock(shown));
  return found;
}

const REVIEW_DEBT = /^## (INVEST Review|Conversation$|Confirmation Plan$)/;

function stillNeeds(blocking) {
  const names = blocking || [];
  const gaps = names.filter((name) => !REVIEW_DEBT.test(name)).map((name) => name.replace(/^## /, ""));
  const parts = [...gaps, ...(names.some((name) => REVIEW_DEBT.test(name)) ? ["an agent review"] : [])];
  return parts.length > 1 ? parts.slice(0, -1).join(", ") + " and " + parts[parts.length - 1] : parts.join("");
}

function waitingReason(shown, dor) {
  if (labelsOf(shown.fields.labels).includes(REFINE)) return "an agent reviews this story before work can start";
  if (dor && !dor.ready) return "the story is not ready: it still needs " + stillNeeds(dor.blocking);
  return "";
}

function titleBlock(shown) {
  return el("h2", { class: "story-title" }, String(shown.fields.title || shown.record));
}

function crumbs(shown) {
  const f = shown.fields;
  const labels = String(f.labels || "").split(",").map((one) => one.trim()).filter(Boolean);
  return el("div", { class: "crumbs" },
    el("span", { class: "inline" }, statusMark(shown.status), el("span", { class: "s-" + shown.status }, STATUS_NAMES[shown.status] || shown.status)),
    priorityPill(f.priority, true),
    f.issue_type ? typePill(f.issue_type) : el("span", { class: "pill t-task" }, "no type"),
    shown.dates && shown.dates.updated ? el("span", { title: shown.dates.updated }, "updated " + age(shown.dates.updated) + (age(shown.dates.updated) === "now" ? "" : " ago")) : null,
    ...labels.map((label) => el("span", { class: "label" }, label)),
    el("span", { class: "id" }, shown.record));
}

async function open(record, quiet) {
  document.body.classList.add("reading");
  const pane = document.getElementById("detail-pane");
  const scrolled = pane.scrollTop;
  const path = "/records/" + encodeURIComponent(record);
  let shown, dor;
  try {
    [shown, dor] = await Promise.all([call("GET", path), call("GET", path + "/dor")]);
  } catch (error) {
    pane.replaceChildren(el("button", { class: "link back", type: "button", onclick: back }, "← back to the list"), el("p", { class: "bad" }, error.message));
    return;
  }
  state.current = shown;
  const f = shown.fields;
  const cards = notices(shown, dor);
  const reviewed = (card) => Boolean(card.classList && card.classList.contains("dod"));
  pane.replaceChildren(
    el("button", { class: "link back", type: "button", onclick: back }, "← back to the list"),
    crumbs(shown),
    titleBlock(shown),
    shown.status === "closed" ? el("div", { class: "notice" }, (f.close_resolution === "cancelled" ? "Cancelled: " : "Closed: ") + String(f.close_reason || "")) : actionsBar(shown, waitingReason(shown, dor)),
    ...cards.filter((card) => !reviewed(card)),
    section("Card · story / context", f.description, "no story yet: say when it happens, what the person wants, and what for"),
    section("Confirmation · acceptance criteria", f.acceptance_criteria, "no acceptance criteria yet"),
    section("Requirements", f.requirements, "no requirements yet"),
    ...(shown.status !== "closed" && (!dor.ready || labelsOf(f.labels).includes(REFINE)) ? [refinementBlock(shown, dor)] : []),
    ...cards.filter(reviewed),
    linksBlock(shown),
    commentsBlock(shown),
    factsBlock(shown));
  pane.scrollTop = quiet ? scrolled : 0;
  drawList();
}

function back() {
  const hash = routeHash(state.tab);
  if (location.hash !== hash) location.hash = hash;
  else closeDetail();
}

function closeDetail() {
  document.body.classList.remove("reading");
  state.current = null;
  document.getElementById("detail-pane").replaceChildren(el("div", { class: "empty" }, "Pick a story from the list, or press New story."));
  drawList();
}

function clearDraft(draft) {
  try { localStorage.removeItem("tracker-draft:" + draft); }
  catch (error) { toast("Saved, but the browser could not clear the retained draft: " + error.message, true); }
}

function pendingForm(form, text, pending = true) {
  form.dataset.pending = pending ? "true" : "";
  form.setAttribute("aria-busy", String(pending));
  for (const control of form.querySelectorAll("input, textarea, select, button")) control.disabled = pending;
  form.querySelector('[type="submit"]').textContent = text;
  if (pending) toast(text + " Your draft is retained.");
  form.querySelector("[role=status]").textContent = pending ? text + " Your draft is retained." : "Your draft is retained; retry or cancel.";
}

function blank() {
  const previous = state.current;
  document.body.classList.add("reading");
  state.current = null;
  drawList();
  const cancel = () => previous ? open(previous.record) : back();
  const form = storyForm({ issue_type: "task", priority: "2" }, { submit: "Create", cancel, draft: "new", note: "Only a title is required. Draft retained in this browser, including after Cancel." });
  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    if (form.dataset.pending) return;
    const made = form.read();
    const labels = [...new Set([...made.labels, REFINE])].join(",");
    const body = { title: made.title, description: made.description, fields: { issue_type: made.issue_type || "task", priority: Number(made.priority || 2), labels } };
    if (made.acceptance.trim()) body.acceptance = made.acceptance;
    if (made.requirements.trim()) body.requirements = made.requirements;
    pendingForm(form, "Creating…");
    let report;
    try {
      report = await call("POST", "/records", body);
    } catch (error) {
      pendingForm(form, "Create", false);
      form.querySelector("[role=status]").textContent = "Create failed: " + error.message + ". Your draft is retained; retry or cancel.";
      return;
    }
    clearDraft("new");
    go(report.record);
    toast("Created. Opening the card…");
    load().catch((error) => toast("Created " + report.record + ". The list could not refresh: " + error.message, true));
  });
  document.getElementById("detail-pane").replaceChildren(el("button", { class: "link back", type: "button", onclick: cancel }, "← back · draft retained"), el("h2", { class: "story-title" }, "New story"), form);
  form.title.focus();
}

function parseRoute(hash) {
  const match = String(hash || "").match(/^#\/(?:([a-z_]+)\/?)?(?:record\/(.+))?$/);
  if (!match) return { view: null, record: null };
  const view = TABS.some(([key]) => key === match[1]) ? match[1] : null;
  return { view, record: match[2] ? decodeURIComponent(match[2]) : null };
}

function routeHash(view, record) {
  return "#/" + view + (record ? "/record/" + encodeURIComponent(record) : "");
}

async function routed() {
  const route = parseRoute(location.hash);
  if (route.view && route.view !== state.tab) await showView(route.view);
  if (route.record && (!state.current || state.current.record !== route.record)) await open(route.record);
  else if (!route.record) closeDetail();
}

const search = document.getElementById("search");
search.addEventListener("input", (event) => { state.query = event.target.value; drawList(); });
search.after(suggest(search, { source: (text) => matching(text, ""), choose: (one) => go(one.record), render: storyRow }));

function busy() {
  const pane = document.getElementById("detail-pane");
  return document.hidden || Boolean(pane.querySelector("form, .bar input, details[open]"))
    || [...pane.querySelectorAll("textarea")].some((area) => !area.readOnly && area.value.trim());
}

async function refreshQuietly() {
  if (busy()) return;
  try {
    await load();
    if (state.current && document.body.classList.contains("reading") && !busy()) await open(state.current.record, true);
  } catch (error) {
    toast("the tracker server did not answer: " + error.message, true);
  }
}

async function watchVersion() {
  if (document.hidden || !state.version || busy()) return;
  try {
    const { version } = await call("GET", "/version");
    if (version !== state.version) await refreshQuietly();
  } catch (error) {
    return;
  }
}

setInterval(watchVersion, 2000);
setInterval(refreshQuietly, 15000);
window.addEventListener("focus", refreshQuietly);
document.getElementById("sort").addEventListener("change", (event) => { state.sort = event.target.value; drawList(); });
document.getElementById("new").addEventListener("click", blank);
document.addEventListener("keydown", (event) => {
  const typing = ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
  if (typing || event.ctrlKey || event.metaKey || event.altKey) return;
  if (event.key === "/") { event.preventDefault(); document.getElementById("search").focus(); }
  if (event.key === "e" && state.current && state.current.status !== "closed" && !document.querySelector("#detail-pane form")) { event.preventDefault(); edit(state.current); }
});
window.addEventListener("hashchange", routed);
document.getElementById("detail-pane").append(el("div", { class: "empty" }, "Pick a story from the list, or press New story."));
load().then(routed).catch((error) => toast(error.message, true));
</script>
</body>
</html>
