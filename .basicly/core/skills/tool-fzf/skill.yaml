instructions: |
  # fzf

  Select lines from a list with fuzzy matching. Use it for a choice that a person makes, or with `--filter` in a script.

  ## Rules

  - **Use `--filter` when there is no terminal.** Interactive mode waits for a person.
  - **Handle the cancel exit in scripts.** Exit code `130` means cancel, not "no match".
  - **Give a fallback that needs no person.** Automation must not depend on a choice.
  - **Split `--multi` output on newlines.** Each selection is on its own line.
  - **Check `FZF_DEFAULT_COMMAND`.** This variable changes the default input.

  ## Commands

  ```bash
  fzf
  git branch --all | fzf
  fd -t f | fzf
  fzf --preview 'bat --color=always {}'
  printf '%s\n' foo bar baz | fzf --filter 'ba'
  fzf --multi
  ```

  ## Output

  - Interactive mode prints the selected lines to stdout.
  - `--filter` prints the matches and exits with 0 on a match, or 1 on no match.
