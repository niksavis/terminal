name: release-process
invocation: model
description: Cut a release of this repository with `basicly release`, then do the steps that command leaves to a person - choose the version, write the summary, push, and confirm the release published. Use when asked to cut a release, tag a version, prepare release notes, or check whether a release published.
instructions: |
  # Release Process

  Cut a release with `basicly release`, which does every step up to the annotated tag. You choose the version, write the summary and push.

  ## Rules

  - **Confirm that this repository releases with `basicly release` first.** The skill ships to every repository that installs basicly, also to one with its own release process.
  - **Never do by hand a step that `basicly release` does.** The command checks every precondition before the first write and restores the tree when a later step fails.
  - **Write the notes before the cut.** The release commit and the tag are one step, so a later commit never reaches the tagged notes.
  - **Never clear a refusal by a manual run of the named tool.** That records a witness for a check that the gate did not see pass.
  - **Never delete a changelog fragment to clear a refusal.** A release note must not disappear without notice.
  - **The command never pushes.** Publication cannot be undone, so a person pushes.

  ## 1. Check that the repository uses it

  ```sh
  ls changelog.d/ 2>/dev/null; grep -n "## \[Unreleased\]" CHANGELOG.md
  ```

  If either is missing, stop and follow the repository's own release document.

  The command also needs a single-sourced `__version__ = "X.Y.Z"` line and the release scripts. The dry run refuses without them, with one of these messages:

  - `no __version__ = "X.Y.Z" line found in ...`
  - `changelog generator missing: ...`
  - `release-note gate missing: ...`

  On any of these, stop and follow the repository's own release document.

  ## 2. Write the notes

  - Each change leaves its entry in `changelog.d/<record-id>.<category>.md`. The categories are `added`, `changed`, `deprecated`, `removed`, `fixed` and `security`. One file per change means that two lanes never collide on one anchor.
  - A hand-written body under `## [Unreleased]` also publishes, beside the fragments.
  - Write a summary under `## [Unreleased]`, above its first `###` heading. Write one paragraph on what the release changes for a user, then themed bullets. Name the record id of a fragment in each highlight.

  The release folds each fragment into `## [Unreleased]` under its Keep a Changelog heading, sorted by category and then by file name. It moves that body into the dated `## vX.Y.Z - <date>` section, deletes the fragments in the same commit, and leaves `[Unreleased]` empty.

  The command refuses before the first write, and names the file, when it finds:

  - an empty fragment;
  - a file name that is not `<record-id>.<category>.md`;
  - fragments and no `## [Unreleased]` heading;
  - an `[Unreleased]` section that `carries no summary above its first ### heading`.

  ## 3. Exercise every declared check

  The command refuses a tag while a `[[verify.checks]]` entry in `basicly.toml` has no recorded run. Only `basicly verify` records a run. A fresh clone has no records, so it refuses the tag until the gates have run.

  A check gets its record only from a mode that declares it. One mode is not enough:

  ```sh
  uv run basicly verify --mode full
  uv run basicly verify --mode fast
  ```

  Read `[[verify.checks]]` for a check that only the `staged` mode declares.

  ## 4. Choose the version and run the dry run

  Choose major, minor or patch yourself. The command refuses a version that does not move forward, but it does not choose one.

  ```sh
  uv run basicly release <version> --issue <record-id> --dry-run
  ```

  The dry run writes nothing and reports every refusal at once. It lists the fragments in the order they assemble. It refuses on:

  - a dirty tree;
  - a version that does not move forward;
  - a tag that already exists;
  - a `--date` that is not `YYYY-MM-DD`;
  - an `--issue` id that the committed ledger does not hold;
  - a linked worktree, because tags are shared with the primary checkout.

  IMPORTANT: the dry run checks preconditions, not the commit gates. The release commit changes the tree, and only the commit gates see that tree. Before you give the command to anyone, prove the release in a scratch clone:

  1. Clone the repository and run `uv sync --group dev`. Copy any `node_modules` that the hooks need.
  2. Run the release in the clone.
  3. Run `git add -A`, then `uv run pre-commit run --hook-stage pre-commit`. No file may change, because a hook that edits a file fails even at exit 0.
  4. Run the whole test suite. A test fixed in a later commit never reaches the tag.

  ## 5. Cut the release

  ```sh
  uv run basicly release <version> --issue <record-id>
  ```

  It bumps `__version__`, regenerates the projections, rewrites the `vX.Y.Z` install pins in `README.md` and the other pin files, assembles the changelog, commits and creates the annotated tag. Add `--date YYYY-MM-DD` to set the changelog date. The default is today.

  For a delegated run, add `--autonomous --root <root-id>`. It needs a green L3 grant on the root. Add `--shipping <node>` to name the node whose gates must be green, because the verify gate of an open epic is never green.

  ## 6. Push and confirm

  Run the two commands that the release prints:

  ```sh
  git push origin main
  git push origin vX.Y.Z
  ```

  When a workflow publishes from the tag push, it reads `CHANGELOG.md` from the tagged commit. Confirm that the workflow run is green and that the release page matches the summary. Never edit the release page after publication. A page that disagrees with its changelog section is a defect.
