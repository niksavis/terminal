instructions: |
  # curl

  Send HTTP requests with exact flags. Use it to check status codes, headers and redirects, and to download files in scripts.

  ## Rules

  - **Use `-f`.** An HTTP error then gives a non-zero exit.
  - **Use `-sS`.** It hides the progress bar and still shows errors.
  - **Use `-L` when you expect a redirect.** Without it, curl stops at the first response.
  - **Quote every URL.** The shell changes an unquoted `?` or `&`.
  - **Keep secrets out of the command line and verbose output.** Both go to history and logs.
  - **Set `Accept` when the format matters.** The server can otherwise choose a different format.

  ## Commands

  ```bash
  curl -fsSL https://example.com
  curl -I https://example.com
  curl -fsSLo output.bin https://example.com/file.bin
  curl -fsS -w '%{http_code}\n' -o /dev/null https://example.com
  curl -fsS -H 'Accept: application/json' https://example.com/api
  curl -fsS -X POST -H 'Content-Type: application/json' -d '{"name":"demo"}' https://example.com/api
  ```

  ## Output

  - Exit code `22` with `-f` means an HTTP status of 400 or more.
  - `-I` prints only the headers.
  - `-w` prints the status or a timing value for a script to test.
