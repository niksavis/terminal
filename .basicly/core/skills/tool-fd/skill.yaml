instructions: |
  # fd

  Find files by name, extension or type. Use it instead of `find` and to feed paths to other tools.

  ## Rules

  - **Know that the pattern is a regular expression.** Add `-g` for a shell glob.
  - **Set `-t f` or `-t d`.** It limits the result to files or to directories.
  - **Expect ignored and hidden files to be skipped.** Add `--hidden` only when the task needs them.
  - **Try `fdfind` when `fd` is missing.** Debian and Ubuntu install the binary as `fdfind`.
  - **Use `-x` for an action on each file.** It replaces a shell loop.

  ## Commands

  ```bash
  fd "pattern"
  fd -e py
  fd -g "pyproject.toml"
  fd --hidden "pattern"
  fd -t f "pattern"
  fd -t d "pattern"
  fd -e md -x wc -l {}
  ```

  ## Output

  - One path on each line, relative to the search root.
  - Empty output with exit code 0 can be a correct result.
