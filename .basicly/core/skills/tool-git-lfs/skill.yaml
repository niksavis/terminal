instructions: |
  # git-lfs

  Store large binary files outside the git history and keep a small pointer in the repository. Use it for images, archives and models that change as whole files.

  ## Rules

  - **Check the patterns before you add a large file.** `git lfs track` with no argument lists them, and `.gitattributes` holds them.
  - **Commit `.gitattributes` with the first tracked file.** Without it, a clone gets the file as a normal blob.
  - **Preview a new pattern with `--dry-run`.** `git lfs track --dry-run "*.psd"` shows the files it would match.
  - **Check that a file is a pointer.** `git lfs ls-files --size` lists the tracked files with their size.
  - **A pointer file in the working tree means no download.** Run `git lfs pull`, or `git lfs pull --include=<paths>` for part of it.
  - **`migrate import` rewrites history.** It changes commit ids, so it needs a person's approval and a force-push. Run `git lfs migrate info` first; it only reads.

  ## Commands

  ```bash
  git lfs install
  git lfs track
  git lfs track --dry-run "*.psd"
  git lfs track "*.psd"
  git lfs ls-files --size
  git lfs status --porcelain
  git lfs pull --include="assets/*"
  git lfs migrate info
  ```

  ## Output

  - `git lfs ls-files` prints the object id, `*` for a downloaded file or `-` for a pointer, and the path.
  - `git lfs status --json` gives the staged and unstaged LFS changes for a script.
