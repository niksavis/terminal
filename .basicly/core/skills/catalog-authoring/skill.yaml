name: catalog-authoring
invocation: model
description: "Authors catalog sources in YAML (always-on fragments, output styles and the skill.yaml format) and projects them. Use before editing a generated file such as SKILL.md, CLAUDE.md or AGENTS.md, or when adding a fragment or output style."
instructions: |
  # Catalog Authoring

  Write catalog sources in YAML and project them to the files that coding agents load.

  ## Steps

  1. Start a skill with `basicly catalog new skill <slug>`, or a fragment with `basicly catalog new fragment <id> --category <category>`.
     Write an output style by hand, as [sources](references/sources.md) shows. Find an existing skill with `basicly catalog list skill`.
  2. Edit the YAML source, never the projected file.
  3. Run `basicly catalog lint`.
  4. Build and check the projection: `basicly build` then `basicly check` for a fragment, `basicly skills-build` then
     `basicly skills-check` for a skill, `basicly styles-build` then `basicly styles-check` for an output style.
  5. Run `basicly catalog verify` before a catalog commit.
  6. Read each projected file back where the agent reads it, as [projection](references/projection.md) shows.

  ## Rules

  - **Never give a source a file name that an agent loads.** Agents load `SKILL.md`, `AGENTS.md`, `CLAUDE.md`, `*.instructions.md`, `*.mdc` and `GEMINI.md` by file name, so a source is `skill.yaml`, `<id>.fragment.yaml` or `style.yaml`.
  - **Apply the deletion test to each bullet.** If its removal causes no mistake, leave it out.
  - **Tag a source with `technologies` only when it is useless outside that technology.** An untagged source ships everywhere.
  - **Keep local sources out of `.basicly/core/` in a consumer repository.** `basicly install --force` overwrites a hand-edited core file. Put a fragment in `.basicly-local/fragments/`.
  - **Put a Claude-only prompt, command or runbook in `.claude/*.md`.** No catalog source projects it.
  - **Add no copy under `.github/instructions/`.** Copilot then loads the same rule twice. Prefer a skill to a prompt file, and put a custom agent in `.github/agents/*.agent.md`.

  ## Read when needed

  - Before creating or changing a source type, read [sources](references/sources.md) for its schema, placement, overlay and host projection.
  - Before composing or delivering guidance, read [projection](references/projection.md) for wording, checks and effective-host readback.
  - Done when the source and its projected files agree, local overlays are kept, and you report each check you ran.
