# yaml-language-server: $schema=../../schemas/skill.schema.json
schema_version: 1
token_cost:
  listing: 80
name: catalog-authoring
invocation: model
description: >-
  Author and improve basicly catalog sources — skills, fragments and output
  styles — in their YAML source format (never a discoverable .md), then project
  and verify them. Use when you add or edit a skill or fragment, build a
  catalog, or decide where guidance should live (always-on fragment or
  on-demand skill).
instructions: |
  # Catalog Authoring

  Write catalog sources in YAML and project them to the files that coding agents load.

  ## Rules

  - **Never name a source for discovery.** Agents load `SKILL.md`, `AGENTS.md`, `CLAUDE.md`, `*.instructions.md`, `*.mdc` and `GEMINI.md` by file name, so a source is `skill.yaml`, `<id>.fragment.yaml` or `style.yaml`. `basicly catalog lint` refuses a `.md` source.
  - **Verify where the agent reads the guidance, not the file you edited.** A host can substitute or fall back, so the projection is not what the agent gets.
  - **Apply the deletion test to each bullet.** If its removal causes no mistake, leave it out.
  - **Tag a source with `technologies` only when it is useless outside that technology.** An untagged source ships everywhere.
  - **Keep local sources out of `.basicly/core/` in a consumer repository.** `basicly install` overwrites `.basicly/core/`. Put a fragment in `.basicly-local/fragments/`.

  ## Where guidance lives

  | Type | Loaded | Projected to | Build, then check |
  | --- | --- | --- | --- |
  | Fragment | Always, merged into `CLAUDE.md`, `AGENTS.md` and `copilot-instructions.md`, or into per-path rule files when scoped | the instruction files | `basicly build`, `basicly check` |
  | Skill | On demand, when its `description` matches the task | `SKILL.md` at each skill root | `basicly skills-build`, `basicly skills-check` |
  | Output style | Always. It replaces the default answer format of Claude Code | `.claude/output-styles/<slug>.md` | `basicly styles-build`, `basicly styles-check` |

  Keep a fragment short. Point to a command, and do not restate a rule that a gate enforces.

  ## Author a skill

  1. Run `basicly catalog new skill <slug>`. It writes `.basicly/core/skills/<slug>/skill.yaml`.
  2. Set `name` equal to the slug.
  3. Write the `description`. It is the discovery trigger, so say when to use the skill.
  4. Write the `instructions` body as a `|` literal block of markdown, indented two spaces.
  5. Run `basicly skills-build`, then `basicly skills-check`. With no arguments they cover every default root, as the `projection-skills` gate does.

  ## Author a fragment

  1. Run `basicly catalog new fragment <id> --category <category>`. It writes `.basicly/core/fragments/<category>/<id>.fragment.yaml`. In a consumer repository, move the file under `.basicly-local/fragments/`.
  2. Set `id`, `description`, `category`, `applies_to` (for example `[all]`) and the `body` block.
  3. Optional fields: `priority`, `tags`, `status`, `title`, `scope.paths` for a path-scoped rule, and the overlay fields `replaces` and `override`.
  4. Run `basicly build`, then `basicly check`.

  ## Author an output style

  1. Write `.basicly/core/output-styles/<slug>/style.yaml` with `name`, `description`, `body` and `keep_coding_instructions`. The directory name is the slug.
  2. Run `basicly styles-build`, then `basicly styles-check`, as the `projection-styles` gate does.

  Keep `keep_coding_instructions: true`, unless you intend to drop the built-in engineering instructions of the host. They include how to verify work.

  ## YAML shape

  Start each source with the schema header and `schema_version`. Write the prose body as a literal block, so the markdown stays unchanged:

  ```yaml
  # yaml-language-server: $schema=../../schemas/skill.schema.json
  schema_version: 1
  name: my-skill
  description: What it does and when to use it.
  instructions: |
    # My Skill
    ...
  ```

  `technologies: [python]` limits a skill, fragment, agent or hook to one technology. The values come from a controlled vocabulary, and `basicly catalog lint` refuses any other value. A consumer selects with `basicly install --technologies ...`.

  ## Phrase a guidance body

  - Write concrete, verifiable instructions: "use 2-space indentation", not "format code properly".
  - Put each runnable command in a code fence. An agent runs a fenced command as written and improvises on a command in prose.
  - Give the alternative with each prohibition. A bare "never X" leaves the agent stuck.
  - Give a one-clause reason, so the rule applies beyond its literal case.
  - Use at most one `IMPORTANT` marker per projection. More markers make each one invisible. `basicly catalog lint` counts them per composed projection and per skill, and refuses the second one by name. A marker in a code span or a fence does not count.

  ## Check

  ```sh
  basicly catalog lint
  basicly catalog dump
  ```

  - `catalog lint` validates every source against its schema. It refuses a `.md` source and a YAML file without the `.yaml` extension. It runs on commit and in CI.
  - `catalog dump` prints what the sources compose to: each planned output, each selected item with the core or `.basicly-local` file it came from, and each overlay override beside the core source it shadows. A wrong projection is a selection question, and `build` prints only the files it wrote.

  ## Verify where the agent reads it

  When a change alters what an agent is told:

  - Read it back where the agent reads it: the advertised skill list, the always-on file as loaded, the rule as injected.
  - Measure a size or cost claim again on the delivered text before you write the figure into a document. A figure measured on the source is a guess about the host.
  - A `user`-invoked skill projects no `description`. Claude Code then fills the listing from the first line of the body.
