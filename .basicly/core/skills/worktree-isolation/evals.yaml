# Tier-2 routing evidence for `worktree-isolation`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "keep this change out of my main checkout"
    - prompt: "two parallel tracks would collide, isolate them"
    - prompt: "set up a sibling checkout on a harness branch"
  negative:
    - prompt: "what work is ready to pick up"
      owner: work-tracker
    - prompt: "advance this issue past its checkpoint"
      owner: harness-loop
tasks:
  - query: "Make a worktree for the flags work and commit there."
    expected_behavior:
      - "Uses basicly worktree create so the hooks and environments are provisioned"
  - query: "Merge the flags worktree; I am inside it right now."
    expected_behavior:
      - "Runs the merge from the main checkout, not from inside the worktree"
  - query: "The commit hooks do not run in my linked worktree; set core.hooksPath to .basicly/hooks there."
    expected_behavior:
      - "Refuses a relative core.hooksPath in a linked worktree and explains it silently skips hooks"
  - query: "basicly worktree cleanup flags refused: uncommitted changes. Just clean it up."
    expected_behavior:
      - "Does not pass --force; commits the changes or reports them to the user and leaves the worktree in place"
