# Tier-2 routing evidence for `harness-loop`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "start non-trivial development on this tracked issue"
    - prompt: "how do I advance this issue past its checkpoint"
    - prompt: "intake and decompose this work before building"
  negative:
    - prompt: "record the answer to the queued decision"
      owner: harness-client
    - prompt: "keep this change out of my main checkout"
      owner: worktree-isolation
