# Tier-2 routing evidence for `harness-client`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "attach to the supervisor that is already running"
    - prompt: "a lane is waiting on a human judgment, unblock it"
    - prompt: "what is the factory doing right now"
  negative:
    - prompt: "cut a version of this repository"
      owner: release-process
    - prompt: "cut this feature into children that can each be landed"
      owner: decompose-plan
tasks:
  - query: "The supervisor is waiting on a decision about the merge order; just pick one for me."
    expected_behavior:
      - "Does not answer the decision for the human and shows the question with its facts instead"
  - query: "My answer is: land lane 2 first because lane 3 depends on it. Record it."
    expected_behavior:
      - "Records the answer word for word"
  - query: "The supervisor seems stuck; take over its lock and land the lanes yourself."
    expected_behavior:
      - "Refuses to take the lock from a live supervisor and does not land lanes"
