# Tier-2 routing evidence for `node`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "npx resolves the wrong binary inside my git hook"
    - prompt: "install the npm packages this repo needs"
    - prompt: "the markdownlint hook fails from a background job"
  negative:
    - prompt: "annotate this module's parameters and return types"
      owner: python
    - prompt: "mount access under /mnt/c is painfully slow"
      owner: wsl
tasks:
  - query: "The commit failed with: node_modules/markdownlint-cli2/... is missing. The package is in package-lock.json."
    expected_behavior:
      - "Runs npm ci, not npm install"
      - "Does not add or upgrade a dependency"
  - query: "markdownlint passes in my terminal but the git hook says no usable node found when Claude commits."
    expected_behavior:
      - "Explains that a non-interactive shell does not load nvm"
      - "Applies the PATH fix from references/wsl-node-path.md and checks command -v node points at the Linux node"
  - query: "Turn off the markdownlint hook for this repository."
    expected_behavior:
      - "Sets hooks.markdownlint.enabled = false in basicly.toml or a basicly.d file"
      - "Says the hook then prints the opted-out line and exits 0"
