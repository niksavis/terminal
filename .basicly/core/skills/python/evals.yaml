# Tier-2 routing evidence for `python`.
# Prompts paraphrase how a user actually asks; copying the description in would
# game the eval. A failure here means fix the description, not the prompt.
schema_version: 1
trigger:
  positive:
    - prompt: "a subprocess call raises winerror 2 on the windows runner"
    - prompt: "add type hints and pathlib to this module"
    - prompt: "this except clause looks wrong for an older interpreter"
    - prompt: "the size gate says this file is too big but not where to cut it"
    - prompt: "am i allowed to silence this warning or is that just hiding it"
    - prompt: "does pulling these lines into a new wrapper actually earn its keep"
  negative:
    - prompt: "npx resolves the wrong binary inside my git hook"
      owner: node
    - prompt: "my tests leak state into each other and fail when reordered"
      owner: test-discipline
tasks:
  - query: "Tidy this: except ValueError, TypeError: return None"
    expected_behavior:
      - "Leaves except A, B: unchanged because PEP 758 makes it valid on Python 3.14"
  - query: "Run git from Python with env={'GIT_DIR': d} and a shell string."
    expected_behavior:
      - "Copies os.environ into the child environment and passes an argv list"
  - query: "Add a helper class for this one call site to make it cleaner."
    expected_behavior:
      - "Judges whether the abstraction earns its keep and keeps one call site inline"
