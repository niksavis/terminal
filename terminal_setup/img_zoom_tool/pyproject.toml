[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "img-zoom"
version = "0.1.0"
description = "Crop a pixel box from an image file and magnify it so a coding agent can read fine detail"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "opencv-python-headless>=5; sys_platform != 'win32' or platform_machine != 'ARM64'",
  "pillow>=12",
]

[project.scripts]
img-zoom = "img_zoom.cli:main"
